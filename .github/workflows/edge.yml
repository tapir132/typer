name: Publish Edge Build

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: typer-edge
  cancel-in-progress: true

jobs:
  edge:
    runs-on: macos-15
    env:
      SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v5
      - name: Test
        run: swift test -Xswiftc -warnings-as-errors
      - name: Configure edge version
        run: |
          build="$(git show -s --format=%ct HEAD)"
          short_sha="${GITHUB_SHA:0:7}"
          base_version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Resources/Info.plist)"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $base_version-edge.$short_sha" Resources/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $build" Resources/Info.plist
      - name: Import signing identity
        env:
          TYPER_SIGNING_P12: ${{ secrets.TYPER_SIGNING_P12 }}
          TYPER_SIGNING_P12_PASSWORD: ${{ secrets.TYPER_SIGNING_P12_PASSWORD }}
        run: ./scripts/import-signing-identity.sh
      - name: Build Typer
        env:
          TYPER_DISTRIBUTION_BUILD: "1"
        run: ./scripts/build-app.sh
      - name: Verify signing identity
        run: codesign -dvv .build/Typer.app 2>&1 | grep -Fq 'Authority=Cadence Signing'
      - name: Create signed Edge appcast
        run: |
          mkdir -p release
          ditto -c -k --sequesterRsrc --keepParent .build/Typer.app release/Typer-edge.zip
          printf '%s' "$SPARKLE_PRIVATE_KEY" | \
            .build/artifacts/sparkle/Sparkle/bin/generate_appcast \
              --ed-key-file - \
              --download-url-prefix "https://github.com/tapir132/typer/releases/download/edge/" \
              --maximum-versions 1 --maximum-deltas 0 \
              -o release/appcast.xml release
      - name: Create disk image
        run: |
          ./scripts/build-dmg.sh .build/Typer.app release/Typer-edge.dmg
          ./scripts/verify-dmg.sh release/Typer-edge.dmg
      - name: Publish rolling Edge prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view edge --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create edge --repo "$GITHUB_REPOSITORY" --title "Typer Edge" --notes "Rolling developer build from main." --prerelease
          fi
          gh release upload edge release/Typer-edge.zip release/Typer-edge.dmg release/appcast.xml --repo "$GITHUB_REPOSITORY" --clobber
